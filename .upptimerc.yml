owner: coinfig-tax
repo: upptime
user-agent: coinfig-tax

sites:
  # The customer-facing API, checked via its health endpoint through the full
  # public path (DNS -> Cloudflare -> ALB -> api) — the path CloudWatch can't see.
  - name: Coinfig API
    url: https://api.coinfig.tax/api/health
    slug: coinfig-api
    maxResponseTime: 5000

  - name: Coinfig App
    url: https://coinfig.tax
    slug: coinfig-app
    maxResponseTime: 5000

# Down-incidents are opened as GitHub issues and assigned here; watching this
# repo is what produces operator e-mail alerts.
assignees:
  - SeekoeiD

status-website:
  cname: status.coinfig.tax
  name: Coinfig Status
  introTitle: "**Coinfig** service status"
  introMessage: Live availability and response times for the Coinfig platform, checked every ~5 minutes from GitHub's infrastructure — independent of our own hosting. All data comes straight from this [GitHub repository](https://github.com/coinfig-tax/upptime).
  navbar:
    - title: Status
      href: /
    - title: coinfig.tax
      href: https://coinfig.tax

# Full schema: https://upptime.js.org/docs/configuration
