name: CI

# Gate for the required `check` status check on main (ISO 27001 source-control
# control: automated checks enforced on production repositories).
#
# Deliberately `pull_request` only. Every other workflow here is cron- or
# dispatch-driven and the monitor bot pushes to main roughly every five
# minutes; adding `push: [main]` would run this ~300 times a day for no signal.
#
# `ubuntu-latest`, never self-hosted: this repository is PUBLIC, and a fork PR
# scheduled onto the worker4 runners would execute untrusted code inside the
# tailnet.
#
# This file is NOT generated by the Upptime template. `update-template` writes
# the template's own workflows and leaves extra files alone — teams-alerts.yml
# has survived every nightly template run since 2026-08-07 on that basis.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A malformed .upptimerc.yml does not fail loudly: the monitor keeps
      # running against the last good config, or silently stops checking a
      # site, and the status page carries on looking healthy. Parse it and
      # assert the pieces that make the page an honest monitor.
      - name: Validate .upptimerc.yml
        run: |
          python3 - <<'PY'
          import sys, yaml

          with open('.upptimerc.yml') as fh:
              cfg = yaml.safe_load(fh)

          errors = []

          if cfg.get('owner') != 'coinfig-tax' or cfg.get('repo') != 'upptime':
              errors.append("owner/repo must stay coinfig-tax/upptime — the monitor writes its history to that repo")

          sites = cfg.get('sites') or []

          if not sites:
              errors.append("no sites configured — the status page would monitor nothing")

          slugs = set()

          for i, site in enumerate(sites):
              where = site.get('name') or f"sites[{i}]"

              for key in ('name', 'url', 'slug'):
                  if not site.get(key):
                      errors.append(f"{where}: missing '{key}'")

              url = site.get('url', '')

              if url and not url.startswith('https://'):
                  errors.append(f"{where}: url must be https")

              slug = site.get('slug')

              if slug in slugs:
                  errors.append(f"{where}: duplicate slug '{slug}' - history files would collide")

              slugs.add(slug)

          # The CNAME is what keeps status.coinfig.tax resolving to the Pages
          # site; a changed or dropped value takes the public page down.
          if (cfg.get('status-website') or {}).get('cname') != 'status.coinfig.tax':
              errors.append("status-website.cname must stay status.coinfig.tax")

          if errors:
              for e in errors:
                  print(f"::error::{e}")

              sys.exit(1)

          print(f"ok: {len(sites)} site(s) configured, cname status.coinfig.tax")
          PY

      # The generated workflows are rewritten nightly by update-template. A
      # hand-edit that breaks YAML there disables monitoring until someone
      # notices the missing runs.
      - name: Workflow YAML parses
        run: |
          python3 - <<'PY'
          import sys, glob, yaml

          failed = False

          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path))
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True

          sys.exit(1 if failed else 0)
          PY
