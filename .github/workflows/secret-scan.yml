name: Secret Scan

# Scans the changes introduced by each PR for committed secrets.
# Scoped to the PR diff (base..head) so it flags NEW leaks without failing on
# secrets already present in git history (handled by rotation + history scrub
# under ISO control SEC-01).
#
# This repository is PUBLIC and its history is world-readable, so a leak here
# is a leak the moment it merges — the same gate the private repos carry.
# `ubuntu-latest`, never self-hosted: a fork PR must not run on worker4.

on:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pinned to a released tag rather than @main: an unpinned third-party
      # action in a security workflow is a supply-chain hole - a compromised
      # or retargeted branch would run as the runner user on every PR.
      # Bump this tag deliberately when upgrading.
      - name: TruffleHog (PR diff)
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown
